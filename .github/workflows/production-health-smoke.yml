name: Production Health Smoke

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-smoke
  cancel-in-progress: false

jobs:
  health:
    name: production-health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deployed health endpoint
        run: node scripts/quality/production-health-smoke.mjs
