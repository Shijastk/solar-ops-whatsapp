name: CI

on:
  push:
  pull_request:
    branches:
      - main
      - agent/driver-automation-continuation
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  driver-migrations:
    name: driver-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solar_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solar_ops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Apply driver migrations to an isolated database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d solar_ops_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;"
          psql -h localhost -U postgres -d solar_ops_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261018140554_ops_drivers_catalog.sql \
            -f supabase/migrations/20261018140604_ops_driver_deactivation_confirmation.sql \
            -f supabase/migrations/20261019114001_ops_agent_settings.sql

      - name: Verify central agent setting defaults off and is service-role-only
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d solar_ops_test -v ON_ERROR_STOP=1 <<'SQL'
          do $test$
          begin
            if (select enabled from public.ops_agent_settings where singleton) is distinct from false then
              raise exception 'Central agent setting must default to disabled';
            end if;
            if has_table_privilege('anon', 'public.ops_agent_settings', 'SELECT')
               or has_table_privilege('authenticated', 'public.ops_agent_settings', 'SELECT')
               or has_table_privilege('anon', 'public.ops_agent_settings', 'UPDATE')
               or has_table_privilege('authenticated', 'public.ops_agent_settings', 'UPDATE') then
              raise exception 'Client roles must not access central agent settings';
            end if;
            if not has_table_privilege('service_role', 'public.ops_agent_settings', 'SELECT')
               or not has_table_privilege('service_role', 'public.ops_agent_settings', 'UPDATE') then
              raise exception 'Service role must be able to manage central agent settings';
            end if;
          end;
          $test$;
          SQL

      - name: Verify sender binding, expiry, and one-time consumption
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d solar_ops_test -v ON_ERROR_STOP=1 <<'SQL'
          do $test$
          declare
            v_driver_success uuid;
            v_driver_wrong_sender uuid;
            v_driver_expired uuid;
            v_result jsonb;
          begin
            insert into public.ops_drivers (name, normalized_name, active)
            values ('Success Driver', 'success driver', true)
            returning id into v_driver_success;
            insert into public.ops_driver_action_confirmations
              (token_hash, sender_phone, driver_id, action, expires_at)
            values (repeat('a', 64), '15550001111', v_driver_success, 'deactivate', now() + interval '5 minutes');

            v_result := public.confirm_ops_driver_deactivation(repeat('a', 64), '15550001111');
            if v_result->>'status' <> 'deactivated' then
              raise exception 'Expected deactivated, got %', v_result;
            end if;
            if (select active from public.ops_drivers where id = v_driver_success) then
              raise exception 'Successful confirmation did not deactivate the driver';
            end if;
            v_result := public.confirm_ops_driver_deactivation(repeat('a', 64), '15550001111');
            if v_result->>'status' <> 'invalid' then
              raise exception 'Replay was not rejected: %', v_result;
            end if;

            insert into public.ops_drivers (name, normalized_name, active)
            values ('Wrong Sender Driver', 'wrong sender driver', true)
            returning id into v_driver_wrong_sender;
            insert into public.ops_driver_action_confirmations
              (token_hash, sender_phone, driver_id, action, expires_at)
            values (repeat('b', 64), '15550002222', v_driver_wrong_sender, 'deactivate', now() + interval '5 minutes');
            v_result := public.confirm_ops_driver_deactivation(repeat('b', 64), '15550003333');
            if v_result->>'status' <> 'invalid' then
              raise exception 'Wrong sender was not rejected: %', v_result;
            end if;
            if not (select active from public.ops_drivers where id = v_driver_wrong_sender) then
              raise exception 'Wrong sender changed driver state';
            end if;

            insert into public.ops_drivers (name, normalized_name, active)
            values ('Expired Driver', 'expired driver', true)
            returning id into v_driver_expired;
            insert into public.ops_driver_action_confirmations
              (token_hash, sender_phone, driver_id, action, created_at, expires_at)
            values (repeat('c', 64), '15550004444', v_driver_expired, 'deactivate',
              now() - interval '10 minutes', now() - interval '5 minutes');
            v_result := public.confirm_ops_driver_deactivation(repeat('c', 64), '15550004444');
            if v_result->>'status' <> 'invalid' then
              raise exception 'Expired token was not rejected: %', v_result;
            end if;
            if not (select active from public.ops_drivers where id = v_driver_expired) then
              raise exception 'Expired token changed driver state';
            end if;
          end;
          $test$;
          SQL


  stock-in-idempotency:
    name: stock-in-idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solar_stock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solar_stock_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Apply stock receipt function to isolated schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 <<'SQL'
          create table public.stock_products (
            id uuid primary key,
            active boolean not null,
            canonical_name text not null
          );
          create table public.stock_ledger (
            id bigserial primary key,
            product_id uuid not null references public.stock_products(id),
            draft_id uuid,
            document_item_id uuid,
            movement_type text not null,
            quantity_delta numeric not null,
            idempotency_key text not null unique
          );
          insert into public.stock_products(id, active, canonical_name)
          values
            ('33333333-3333-4333-8333-333333333333', true, 'Synthetic panel'),
            ('99999999-9999-4999-8999-999999999999', true, 'Synthetic inverter');
          SQL
          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261019071044_stock_in_idempotency_lock_order.sql
          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261019080421_stock_in_idempotency_payload_conflict.sql

      - name: Verify concurrent retry returns idempotent status without duplicate receipt
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 -At <<'SQL' > /tmp/stock-first.out &
          begin;
          select pg_advisory_xact_lock(hashtextextended(
            'stock_in:44444444-4444-4444-8444-444444444444', 0
          ));
          select pg_sleep(2);
          select public.record_stock_in(
            '33333333-3333-4333-8333-333333333333', 7,
            '44444444-4444-4444-8444-444444444444'
          )->>'status';
          commit;
          SQL
          first_pid=$!
          sleep 0.3
          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 -At -c "select public.record_stock_in('33333333-3333-4333-8333-333333333333', 7, '44444444-4444-4444-8444-444444444444')->>'status'" > /tmp/stock-retry.out
          wait "$first_pid"
          grep -q 'stock_in_applied' /tmp/stock-first.out
          grep -q 'stock_in_already_applied' /tmp/stock-retry.out
          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 -At -c "select count(*) from public.stock_ledger where idempotency_key = 'stock_in:44444444-4444-4444-8444-444444444444'" | grep -qx '1'

      - name: Verify invalid and inactive receipts plus failure recovery
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.stock_products(id, active, canonical_name)
          values ('55555555-5555-4555-8555-555555555555', false, 'Inactive panel');

          do $test$
          declare
            v_result jsonb;
          begin
            v_result := public.record_stock_in(
              '33333333-3333-4333-8333-333333333333', 0,
              '66666666-6666-4666-8666-666666666666'
            );
            if v_result->>'status' <> 'invalid_item' then
              raise exception 'Zero quantity should be invalid: %', v_result;
            end if;

            v_result := public.record_stock_in(
              '33333333-3333-4333-8333-333333333333', 1, null
            );
            if v_result->>'status' <> 'invalid_item' then
              raise exception 'Missing request ID should be invalid: %', v_result;
            end if;

            v_result := public.record_stock_in(
              '55555555-5555-4555-8555-555555555555', 1,
              '77777777-7777-4777-8777-777777777777'
            );
            if v_result->>'status' <> 'not_ready' then
              raise exception 'Inactive product should not accept stock: %', v_result;
            end if;

            if exists (
              select 1 from public.stock_ledger
              where idempotency_key in (
                'stock_in:66666666-6666-4666-8666-666666666666',
                'stock_in:77777777-7777-4777-8777-777777777777',
                'stock_in:'
              )
            ) then
              raise exception 'Invalid or inactive receipt wrote ledger rows';
            end if;
          end;
          $test$;

          create function public.reject_test_quantity() returns trigger
          language plpgsql as $trigger$
          begin
            if new.quantity_delta = 13 then
              raise exception 'intentional failure-recovery fixture';
            end if;
            return new;
          end;
          $trigger$;
          create trigger reject_test_quantity
            before insert on public.stock_ledger
            for each row execute function public.reject_test_quantity();
          SQL

          set +e
          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 \
            -c "select public.record_stock_in('33333333-3333-4333-8333-333333333333', 13, '88888888-8888-4888-8888-888888888888')->>'status'" \
            > /tmp/stock-failure-recovery.out 2>&1
          failed_status=$?
          set -e
          if [ "$failed_status" -eq 0 ]; then
            echo "Expected the injected ledger failure to abort the receipt"
            exit 1
          fi

          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 -At \
            -c "select count(*) from public.stock_ledger where idempotency_key = 'stock_in:88888888-8888-4888-8888-888888888888'" \
            | grep -qx '0'

          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 \
            -c "drop trigger reject_test_quantity on public.stock_ledger; drop function public.reject_test_quantity()"

          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 -At \
            -c "select public.record_stock_in('33333333-3333-4333-8333-333333333333', 13, '88888888-8888-4888-8888-888888888888')->>'status'" \
            | grep -qx 'stock_in_applied'

          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 -At \
            -c "select count(*) from public.stock_ledger where idempotency_key = 'stock_in:88888888-8888-4888-8888-888888888888'" \
            | grep -qx '1'

      - name: Verify payload conflicts and concurrent cross-product key reuse
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 <<'SQL'
          do $test$
          declare
            v_result jsonb;
          begin
            v_result := public.record_stock_in(
              '33333333-3333-4333-8333-333333333333', 8,
              '44444444-4444-4444-8444-444444444444'
            );
            if v_result->>'status' <> 'idempotency_conflict' then
              raise exception 'Same key with different quantity must conflict: %', v_result;
            end if;

            v_result := public.record_stock_in(
              '99999999-9999-4999-8999-999999999999', 7,
              '44444444-4444-4444-8444-444444444444'
            );
            if v_result->>'status' <> 'idempotency_conflict' then
              raise exception 'Same key with different product must conflict: %', v_result;
            end if;

            if (select count(*) from public.stock_ledger
                where idempotency_key = 'stock_in:44444444-4444-4444-8444-444444444444') <> 1
            then
              raise exception 'Payload conflict wrote a second ledger row';
            end if;
            if (select quantity_delta from public.stock_ledger
                where idempotency_key = 'stock_in:44444444-4444-4444-8444-444444444444') <> 7
            then
              raise exception 'Payload conflict changed the original receipt quantity';
            end if;
          end;
          $test$;
          SQL

          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 -At <<'SQL' > /tmp/cross-product-first.out &
          begin;
          select pg_advisory_xact_lock(hashtextextended(
            'stock_in:aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', 0
          ));
          select pg_sleep(1);
          select public.record_stock_in(
            '33333333-3333-4333-8333-333333333333', 5,
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          )->>'status';
          commit;
          SQL
          first_pid=$!
          sleep 0.2
          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 -At \
            -c "select public.record_stock_in('99999999-9999-4999-8999-999999999999', 9, 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa')->>'status'" \
            > /tmp/cross-product-second.out
          wait "$first_pid"
          cat /tmp/cross-product-first.out /tmp/cross-product-second.out | sort > /tmp/cross-product-statuses.out
          grep -qx 'stock_in_applied' /tmp/cross-product-statuses.out
          grep -qx 'idempotency_conflict' /tmp/cross-product-statuses.out
          psql -h localhost -U postgres -d solar_stock_test -v ON_ERROR_STOP=1 -At \
            -c "select count(*) from public.stock_ledger where idempotency_key = 'stock_in:aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'" \
            | grep -qx '1'

  stock-ledger-workflows:
    name: stock-ledger-workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solar_stock_workflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solar_stock_workflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Bootstrap isolated application schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d solar_stock_workflow_test -v ON_ERROR_STOP=1 \
            -f tests/sql/stock-workflow-base-fixture.sql

      - name: Apply repository migrations to isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d solar_stock_workflow_test -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify stock query company identity and known-zero semantics
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d solar_stock_workflow_test -v ON_ERROR_STOP=1 \\
            -f tests/sql/stock-query-acceptance.sql

      - name: Verify operational RPC and stock-table least privilege
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d solar_stock_workflow_test -v ON_ERROR_STOP=1 <<'SQL'
          do $test$
          declare
            v_signature text;
            v_signatures text[] := array[
              'public.record_stock_in(uuid,numeric,uuid)',
              'public.apply_stock_out_for_draft(uuid)',
              'public.claim_stock_document(uuid)',
              'public.get_mobile_today_totals()',
              'public.get_mobile_trip_activity()',
              'public.mobile_bill_change(uuid,text,uuid,numeric,text,uuid)',
              'public.mobile_manual_dispatch(uuid,uuid,text,uuid,integer,text,jsonb)',
              'public.mobile_save_bill_trip(uuid,uuid,uuid,uuid[],text)',
              'public.mobile_trip_action(uuid,uuid,text,text)',
              'public.mobile_update_trip(uuid,uuid,boolean)'
            ];
          begin
            foreach v_signature in array v_signatures loop
              if has_function_privilege('anon', v_signature, 'EXECUTE') then
                raise exception 'anon can execute sensitive RPC %', v_signature;
              end if;
              if has_function_privilege('authenticated', v_signature, 'EXECUTE') then
                raise exception 'authenticated can execute sensitive RPC %', v_signature;
              end if;
              if not has_function_privilege('service_role', v_signature, 'EXECUTE') then
                raise exception 'service_role cannot execute required RPC %', v_signature;
              end if;
            end loop;

            if has_table_privilege('anon', 'public.stock_ledger', 'SELECT')
              or has_table_privilege('authenticated', 'public.stock_ledger', 'SELECT')
              or has_table_privilege('anon', 'public.stock_ledger', 'INSERT')
              or has_table_privilege('authenticated', 'public.stock_ledger', 'INSERT')
            then
              raise exception 'direct stock_ledger access is exposed to client roles';
            end if;

            if has_table_privilege('anon', 'public.stock_products', 'SELECT')
              or has_table_privilege('authenticated', 'public.stock_products', 'SELECT')
              or has_table_privilege('anon', 'public.stock_products', 'UPDATE')
              or has_table_privilege('authenticated', 'public.stock_products', 'UPDATE')
            then
              raise exception 'direct stock_products access is exposed to client roles';
            end if;

            if has_table_privilege('anon', 'public.stock_balances', 'SELECT')
              or has_table_privilege('authenticated', 'public.stock_balances', 'SELECT')
            then
              raise exception 'direct stock_balances access is exposed to client roles';
            end if;

            if not has_table_privilege('service_role', 'public.stock_ledger', 'INSERT')
              or not has_table_privilege('service_role', 'public.stock_products', 'UPDATE')
            then
              raise exception 'service_role is missing required stock write privileges';
            end if;
          end;
          $test$;
          SQL

      - name: Verify stock ledger and trip workflow SQL acceptance
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d solar_stock_workflow_test -v ON_ERROR_STOP=1 \
            -f tests/sql/duplicate-stock-rollback.sql | tee /tmp/stock-workflow-test.out
          grep -q "PASS: first application" /tmp/stock-workflow-test.out

          psql -h localhost -U postgres -d solar_stock_workflow_test -v ON_ERROR_STOP=1 \
            -f tests/sql/mobile-trip-lifecycle-rollback.sql
          echo "PASS: mobile trip lifecycle rollback"

          psql -h localhost -U postgres -d solar_stock_workflow_test -v ON_ERROR_STOP=1 \
            -f tests/sql/mobile-trip-reuse-rollback.sql
          echo "PASS: mobile trip reuse rollback"
